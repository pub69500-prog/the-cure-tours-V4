name: Build and deploy STATICURE

on:
  push:
    branches:
      - main

  schedule:
    # ============================================================
    # SYNCHRONISATIONS AUTOMATIQUES
    #
    # Heure locale de Paris.
    # GitHub gère automatiquement heure d'été / heure d'hiver.
    #
    # 04h43 : synchronisation principale
    # 07h43 : première synchronisation de secours
    # 09h43 : deuxième synchronisation de secours
    # ============================================================

    - cron: "43 4 * * *"
      timezone: "Europe/Paris"

    - cron: "43 7 * * *"
      timezone: "Europe/Paris"

    - cron: "43 9 * * *"
      timezone: "Europe/Paris"

  workflow_dispatch:
    inputs:
      skip_cureguide:
        description: "Skip Cure Concerts Guide sync"
        required: false
        default: false
        type: boolean

      full_cureguide:
        description: "Full Cure Guide scan (~500+ pages)"
        required: false
        default: false
        type: boolean


permissions:
  contents: write
  pages: write
  id-token: write


concurrency:
  group: "pages"
  cancel-in-progress: false


jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================================
      # DONNÉES INITIALES
      # ============================================================

      - name: Seed initial data
        run: |
          python -u scripts/seed_data.py


      # ============================================================
      # CURE CONCERTS GUIDE
      #
      # Source canonique des concerts.
      #
      # En cas d'échec :
      #
      # tentative 1 : immédiate
      # tentative 2 : après 30 secondes
      # tentative 3 : après 60 secondes
      # tentative 4 : après 120 secondes
      #
      # Après 4 échecs, le workflow passe en erreur.
      # ============================================================

      - name: Synchronize Cure Concerts Guide
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_cureguide }}

        env:
          CUREGUIDE_RESPECT_ROBOTS: "true"
          CUREGUIDE_FULL_SCAN: ${{ inputs.full_cureguide || false }}

        run: |
          set +e

          echo "============================================"
          echo "Cure Concerts Guide synchronization"
          echo "============================================"

          for attempt in 1 2 3 4
          do
            echo ""
            echo "Cure Guide attempt ${attempt}/4"
            echo ""

            python -u scripts/sync_cureguide.py
            status=$?

            if [ "$status" -eq 0 ]; then
              echo ""
              echo "Cure Guide synchronization successful."
              exit 0
            fi

            echo ""
            echo "Cure Guide synchronization failed."
            echo "Exit code: $status"

            if [ "$attempt" -eq 1 ]; then
              wait_time=30
            elif [ "$attempt" -eq 2 ]; then
              wait_time=60
            elif [ "$attempt" -eq 3 ]; then
              wait_time=120
            else
              break
            fi

            echo "Waiting ${wait_time}s before retry..."
            sleep "$wait_time"
          done

          echo ""
          echo "ERROR: Cure Guide failed after 4 attempts."
          exit 1


      # ============================================================
      # SETLIST.FM
      #
      # Source secondaire pour enrichir les setlists.
      # Cure Guide reste la source canonique des concerts.
      # ============================================================

      - name: Synchronize setlist.fm
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}

        run: |
          python -u scripts/sync_setlistfm.py


      # ============================================================
      # TESTS
      # ============================================================

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v


      # ============================================================
      # BUILD DU SITE
      # ============================================================

      - name: Build site
        run: |
          python -u scripts/build_site.py


      # ============================================================
      # EXPORT EXCEL
      # ============================================================

      - name: Export Excel
        run: |
          python -u scripts/export_excel.py


      # ============================================================
      # SAUVEGARDE AUTOMATIQUE DES DONNÉES
      #
      # Uniquement pour :
      #
      # - schedule
      # - workflow_dispatch
      #
      # Les runs déclenchés par un push ne créent pas
      # automatiquement un nouveau commit.
      #
      # IMPORTANT :
      #
      # On ne fait PLUS de :
      #
      # git rebase --autostash origin/main
      #
      # Si main a changé pendant la synchronisation,
      # on abandonne simplement le push de ce run.
      #
      # Le prochain passage repartira de la nouvelle version
      # de main et resynchronisera les données.
      # ============================================================

      - name: Persist updated canonical data
        if: ${{ github.event_name != 'push' }}

        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "============================================"
          echo "Checking repository state before data commit"
          echo "============================================"

          git fetch origin main

          START_SHA="${{ github.sha }}"
          REMOTE_SHA="$(git rev-parse origin/main)"

          echo ""
          echo "Workflow started from:"
          echo "$START_SHA"

          echo ""
          echo "Current origin/main:"
          echo "$REMOTE_SHA"

          echo ""

          if [ "$START_SHA" != "$REMOTE_SHA" ]; then
            echo "WARNING:"
            echo "main changed while this workflow was running."
            echo ""
            echo "Canonical data will NOT be pushed by this run."
            echo ""
            echo "This prevents conflicts in:"
            echo "  data/concerts.json"
            echo "  data/changelog.json"
            echo "  data/state.json"
            echo ""
            echo "A later synchronization will restart"
            echo "from the newer main branch."
            exit 0
          fi

          echo "main has not changed."
          echo "Preparing canonical data..."

          git add data/

          if git diff --cached --quiet; then

            echo ""
            echo "No canonical data changes to commit."

          else

            echo ""
            echo "Canonical data changed."
            echo "Creating automatic commit..."

            git commit -m "chore: automatic concert database update [skip ci]"

            echo ""
            echo "============================================"
            echo "Final safety check before push"
            echo "============================================"

            git fetch origin main

            REMOTE_SHA_AFTER="$(git rev-parse origin/main)"

            echo ""
            echo "Workflow started from:"
            echo "$START_SHA"

            echo ""
            echo "Current origin/main:"
            echo "$REMOTE_SHA_AFTER"

            echo ""

            if [ "$START_SHA" != "$REMOTE_SHA_AFTER" ]; then
              echo "WARNING:"
              echo "main changed just before the automatic push."
              echo ""
              echo "Automatic data push skipped."
              echo "No rebase will be attempted."
              echo ""
              echo "A later synchronization will restart"
              echo "from the newer main branch."
              exit 0
            fi

            echo "Repository still unchanged."
            echo "Pushing canonical data..."

            git push origin HEAD:main

            echo ""
            echo "Canonical data successfully pushed."

          fi


      # ============================================================
      # GITHUB PAGES
      # ============================================================

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5


      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist


      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
