name: Build and deploy STATICURE

on:
  push:
    branches:
      - main

  schedule:
    # Synchronisation quotidienne à 04:17 UTC
    - cron: "17 4 * * *"

  workflow_dispatch:
    inputs:
      skip_cureguide:
        description: "Skip Cure Concerts Guide sync"
        required: false
        default: false
        type: boolean

      full_cureguide:
        description: "Full Cure Guide scan (~500+ pages)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed initial data
        run: |
          python -u scripts/seed_data.py

      # ============================================================
      # CURE CONCERTS GUIDE
      # ============================================================

      - name: Synchronize Cure Concerts Guide
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_cureguide }}
        env:
          CUREGUIDE_RESPECT_ROBOTS: "true"
          CUREGUIDE_FULL_SCAN: ${{ inputs.full_cureguide || false }}
        run: |
          python -u scripts/sync_cureguide.py

      # ============================================================
      # SETLIST.FM
      # ============================================================

      - name: Synchronize setlist.fm
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: |
          python -u scripts/sync_setlistfm.py

      # ============================================================
      # TESTS
      # ============================================================

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

      # ============================================================
      # BUILD DU SITE
      # ============================================================

      - name: Build site
        run: |
          python -u scripts/build_site.py

      # ============================================================
      # EXPORT EXCEL
      # ============================================================

      - name: Export Excel
        run: |
          python -u scripts/export_excel.py

      # ============================================================
      # SAUVEGARDE AUTOMATIQUE DES DONNÉES
      # ============================================================

      - name: Persist updated canonical data
        if: ${{ github.event_name != 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No canonical data changes to commit."
          else
            git commit -m "chore: automatic concert database update [skip ci]"

            echo "Synchronizing with latest main..."
            git fetch origin main
            git rebase --autostash origin/main

            git push origin HEAD:main
          fi

      # ============================================================
      # GITHUB PAGES
      # ============================================================

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
