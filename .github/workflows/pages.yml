name: Build and deploy

on:
  workflow_dispatch:
    inputs:
      skip_cureguide:
        description: "Skip Cure Concerts Guide sync"
        required: false
        default: false
        type: boolean

      full_cureguide:
        description: "Full Cure Guide scan (~500+ pages)"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================================
      # CURE CONCERTS GUIDE
      # ==========================================================

      - name: Synchronize Cure Concerts Guide
        if: ${{ !inputs.skip_cureguide }}
        env:
          CUREGUIDE_RESPECT_ROBOTS: "true"
          CUREGUIDE_FULL_SCAN: ${{ inputs.full_cureguide }}
        run: |
          python -u scripts/sync_cureguide.py

      # ==========================================================
      # SETLIST.FM
      # ==========================================================

      - name: Synchronize setlist.fm
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: |
          python -u scripts/sync_setlistfm.py

      # ==========================================================
      # TESTS
      # ==========================================================

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build site
        run: |
          python -u scripts/build_site.py

      # ==========================================================
      # EXCEL
      # ==========================================================

      - name: Export Excel
        run: |
          python -u scripts/export_excel.py

      # ==========================================================
      # COMMIT AUTOMATIQUE DES DONNÉES
      # ==========================================================

      - name: Commit automatic updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: automatic concert database update"

            git pull --rebase origin main
            git push origin main
          fi

      # ==========================================================
      # GITHUB PAGES
      # ==========================================================

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
