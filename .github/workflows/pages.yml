name: Build and deploy STATICURE

on:
  push:
    branches:
      - main

  schedule:
    # Synchronisation principale quotidienne à 04:17 UTC
    # Synchronisation de secours quotidienne à 05:17 UTC
    # En France métropolitaine :
    # heure d'été  -> 06:17 et 07:17
    # heure d'hiver -> 05:17 et 06:17
    - cron: "55 4,5 * * *"

  workflow_dispatch:
    inputs:
      skip_cureguide:
        description: "Skip Cure Concerts Guide sync"
        required: false
        default: false
        type: boolean

      full_cureguide:
        description: "Full Cure Guide scan (~500+ pages)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # DONNÉES INITIALES
      # ============================================================

      - name: Seed initial data
        run: |
          python -u scripts/seed_data.py

      # ============================================================
      # CURE CONCERTS GUIDE
      #
      # Source canonique des concerts.
      # ============================================================

      - name: Synchronize Cure Concerts Guide
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_cureguide }}
        env:
          CUREGUIDE_RESPECT_ROBOTS: "true"
          CUREGUIDE_FULL_SCAN: ${{ inputs.full_cureguide || false }}
        run: |
          python -u scripts/sync_cureguide.py

      # ============================================================
      # SETLIST.FM
      #
      # Source secondaire pour l'enrichissement des setlists.
      # ============================================================

      - name: Synchronize setlist.fm
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: |
          python -u scripts/sync_setlistfm.py

      # ============================================================
      # TESTS
      # ============================================================

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

      # ============================================================
      # BUILD DU SITE
      # ============================================================

      - name: Build site
        run: |
          python -u scripts/build_site.py

      # ============================================================
      # EXPORT EXCEL
      # ============================================================

      - name: Export Excel
        run: |
          python -u scripts/export_excel.py

      # ============================================================
      # SAUVEGARDE AUTOMATIQUE DES DONNÉES
      #
      # Seulement pour les exécutions planifiées ou manuelles.
      # Un simple push ne génère pas un nouveau commit automatique.
      # ============================================================

      - name: Persist updated canonical data
        if: ${{ github.event_name != 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No canonical data changes to commit."
          else
            git commit -m "chore: automatic concert database update [skip ci]"

            echo "Synchronizing with latest main..."
            git fetch origin main
            git rebase --autostash origin/main

            git push origin HEAD:main
          fi

      # ============================================================
      # GITHUB PAGES
      # ============================================================

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
