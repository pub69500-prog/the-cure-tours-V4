name: Synchroniser les archives et publier
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Seed initial data if needed
        run: test -f data/concerts.json || python scripts/seed_data.py
      - name: Synchronize Cure Concerts Guide
        env:
          CUREGUIDE_RESPECT_ROBOTS: 'true'
        run: python scripts/sync_cureguide.py
      - name: Synchronize setlist.fm
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: python scripts/sync_setlistfm.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build site and Excel
        run: python scripts/build_site.py && python scripts/export_excel.py
      - name: Persist updated canonical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): daily archive sync [skip ci]"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
